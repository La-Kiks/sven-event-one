<div class="login-page">

    <div class="login-card">
        <div class="card-header">
            <div class="logo-mark">SR</div>
            <h1>Welcome back</h1>
            <p>Sign in to your account</p>
        </div>

        <div class="error-banner" *ngIf="errorMessage">
            <span class="error-icon">!</span>
            {{ errorMessage }}
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" type="text" [(ngModel)]="username" placeholder="Enter your username"
                [class.has-value]="username" (keyup.enter)="onSubmit()" autocomplete="username" />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" [(ngModel)]="password" placeholder="Enter your password"
                [class.has-value]="password" (keyup.enter)="onSubmit()" autocomplete="current-password" />
        </div>

        <button class="submit-btn" (click)="onSubmit()" [disabled]="isLoading">
            <span *ngIf="!isLoading">Sign in</span>
            <span *ngIf="isLoading" class="spinner"></span>
        </button>
    </div>

</div>
