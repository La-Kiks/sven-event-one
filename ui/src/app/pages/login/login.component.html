<div class="login-page">

    <div class="login-card">
        <div class="card-header">
            <a class="logo-mark" routerLink="/" aria-label="Retour à l'accueil">54</a>
            <h1>Bon retour</h1>
            <p>Connectez-vous à votre compte</p>
        </div>

        <div class="error-banner" id="login-error" *ngIf="errorMessage" role="alert" aria-live="polite">
            <span class="error-icon" aria-hidden="true">!</span>
            {{ errorMessage }}
        </div>

        <div class="form-group">
            <label for="username">Email</label>
            <input id="username" type="email" [(ngModel)]="username" placeholder="Entrez votre email"
                [class.has-value]="username" (keyup.enter)="onSubmit()" autocomplete="email"
                [attr.aria-invalid]="errorMessage ? true : null"
                [attr.aria-describedby]="errorMessage ? 'login-error' : null" />
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input id="password" type="password" [(ngModel)]="password" placeholder="Entrez votre mot de passe"
                [class.has-value]="password" (keyup.enter)="onSubmit()" autocomplete="current-password"
                [attr.aria-invalid]="errorMessage ? true : null"
                [attr.aria-describedby]="errorMessage ? 'login-error' : null" />
        </div>

        <button class="submit-btn" (click)="onSubmit()" [disabled]="isLoading">
            <span *ngIf="!isLoading">Se connecter</span>
            <span *ngIf="isLoading" class="spinner"></span>
        </button>

        <p class="forgot-password-link"><a routerLink="/mot-de-passe-oublie">Mot de passe oublié ?</a></p>
        <p class="register-link">Pas encore inscrit(e) ? <a routerLink="/inscription">Inscrivez votre équipe</a></p>
    </div>

</div>
