<div class="login-page">

    <div class="login-card">
        <div class="card-header">
            <a class="logo-mark" routerLink="/" aria-label="Retour à l'accueil">SR</a>
            <h1>Mot de passe oublié</h1>
            <p>Recevez un lien pour définir un nouveau mot de passe</p>
        </div>

        <div class="error-banner" id="forgot-error" *ngIf="errorMessage" role="alert" aria-live="polite">
            <span class="error-icon" aria-hidden="true">!</span>
            {{ errorMessage }}
        </div>

        <div *ngIf="!successMessage">
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" [(ngModel)]="email" placeholder="Entrez votre email"
                    [class.has-value]="email" (keyup.enter)="onSubmit()" (input)="clearError()" autocomplete="email"
                    [attr.aria-invalid]="errorMessage ? true : null"
                    [attr.aria-describedby]="errorMessage ? 'forgot-error' : null" />
            </div>

            <button class="submit-btn" (click)="onSubmit()" [disabled]="isLoading">
                <span *ngIf="!isLoading">Envoyer le lien</span>
                <span *ngIf="isLoading" class="spinner"></span>
            </button>
        </div>

        <ng-container *ngIf="successMessage">
            <p class="success-text" role="status">{{ successMessage }}</p>
            <p class="retry-link"><button type="button" (click)="tryAnotherEmail()">Mauvaise adresse ? Réessayer</button></p>
        </ng-container>

        <p class="back-link"><a routerLink="/login">Retour à la connexion</a></p>
    </div>

</div>
