<article class="card">
    <div class="card__media">
        <img [src]="image" [alt]="alt">
        <span class="card__number">{{ number }}</span>
    </div>
    <div class="card__body">
        <div class="card__name">{{ name }}</div>
        <div class="card__metric">{{ metric }}</div>
    </div>
</article>
