<!-- Active: navigates to link -->
<a *ngIf="!isFull" class="btn" [class.btn--small]="small" [routerLink]="link" target="_blank"
    rel="noopener noreferrer">
    {{ label }}
</a>

<!-- Full: no link, visually disabled -->
<span *ngIf="isFull" class="btn btn--full" [class.btn--small]="small">
    INSCRIPTIONS FERME
</span>
