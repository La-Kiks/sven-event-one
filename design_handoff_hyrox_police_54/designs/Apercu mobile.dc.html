<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas" />
<style>
@font-face { font-family: "Lemon"; src: url("ui/public/fonts/Lemon/LEMONMILK-Regular.otf") format("opentype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Cabin"; src: url("ui/public/fonts/Cabin/Cabin-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
body { margin: 0; padding: 0; background-color: #141414; }
a { color: #ffed00; }
a:hover { color: #ffffff; }
</style>
</helmet>
<div style="background:#141414;min-height:100vh;padding:2.5rem;font-family:Cabin,'Segoe UI',Roboto,Arial,sans-serif;color:#fff">
  <h1 style="font-family:Lemon,sans-serif;font-size:1.4rem;margin:0 0 0.5rem;text-transform:uppercase;letter-spacing:0.04em">Aperçu mobile — 390 × 844</h1>
  <p style="color:rgba(255,255,255,0.45);margin:0 0 2rem;font-size:0.9rem">Chaque écran tourne en vrai dans un cadre de téléphone : tu peux scroller et cliquer à l'intérieur.</p>
  <div style="display:flex;flex-wrap:wrap;gap:2rem">
    <sc-for list="{{ screens }}" as="s" hint-placeholder-count="4">
      <figure style="margin:0;display:flex;flex-direction:column;gap:0.7rem">
        <figcaption style="font-size:0.75rem;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.5)">{{ s.label }}</figcaption>
        <div style="width:414px;height:868px;border-radius:38px;background:#000;border:1px solid rgba(255,255,255,0.16);box-shadow:0 20px 50px rgba(0,0,0,0.6);padding:12px;box-sizing:border-box">
          <iframe src="{{ s.src }}" title="{{ s.label }}" style="width:390px;height:844px;border:0;border-radius:26px;background:#000;display:block"></iframe>
        </div>
      </figure>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      screens: [
        { label: 'Landing', src: 'Landing refonte.dc.html' },
        { label: 'Inscription', src: 'Inscription refonte.dc.html' },
        { label: 'Mon équipe', src: 'Mon equipe refonte.dc.html' },
        { label: 'Admin', src: 'Admin refonte.dc.html' }
      ]
    };
  }
}
</script>
</body>
</html>
