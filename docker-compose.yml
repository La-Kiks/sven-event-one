services:
  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: sports-reservation-ui
    ports:
      - "${UI_PORT}:80"
    environment:
      - API_URL=${API_URL}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend/SportsReservationAPI
      dockerfile: Dockerfile
    container_name: sports-reservation-api
    ports:
      - "${API_PORT}:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=Server=database;Database=${DB_NAME};User Id=${DB_USER};Password=${SA_PASSWORD};TrustServerCertificate=TrustServerCertificate
      - Stripe__SecretKey=${STRIPE_SECRET_KEY}
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      - database

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sports-reservation-db
    ports:
      - "1433-1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Express
    volumes: -sql-data:/var/opt/mssql

volumes:
  sql-data:
