services:
  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: sports-reservation-ui
    ports:
      - "${UI_PORT}:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend/SportsReservationAPI
      dockerfile: Dockerfile
    container_name: sports-reservation-api
    ports:
      - "${API_PORT}:8080"
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

      API_BASE_URL: ${API_BASE_URL}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      ENVIRONMENT: ${ENVIRONMENT}

      RESERVATION_DB_SERVER: database
      RESERVATION_DB_NAME: ${RESERVATION_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - database

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sports-reservation-db
    ports:
      - "${DB_PORT}:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: Express
    volumes:
      - sql-data:/var/opt/mssql

volumes:
  sql-data:
