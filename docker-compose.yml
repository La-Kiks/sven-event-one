services:
  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: sports-reservation-ui
    ports:
      - "${UI_PORT}:80"
    environment:
      API_BASE_URL: ${API_BASE_URL}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend/SportsReservationAPI
      dockerfile: Dockerfile
    container_name: sports-reservation-api
    ports:
      - "${API_PORT}:8080"
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRODUCT_PRICE_DUO: ${STRIPE_PRODUCT_PRICE_DUO}

      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      MAILGUN_BASE_URL: ${MAILGUN_BASE_URL}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}

      JWT_KEY: ${JWT_KEY}
      JWT_ISSUER: ${JWT_ISSUER}

      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      API_BASE_URL: ${API_BASE_URL}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      ENVIRONMENT: ${ENVIRONMENT}

      RESERVATION_DB_SERVER: database
      RESERVATION_DB_NAME: ${RESERVATION_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - database

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sports-reservation-db
    ports:
      - "${DB_PORT}:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: Express
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD}' -Q 'SELECT 1' -No || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s # give SQL Server time to initialize

  test-database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sports-reservation-test-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Test_Password123!"
      MSSQL_PID: Express
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Test_Password123!' -Q 'SELECT 1' -No || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # No volume — ephemeral on purpose, so every run can start from a known state.

  tests:
    build:
      context: ./backend
      dockerfile: SportsReservationAPI.Tests/Dockerfile
    container_name: sports-reservation-tests
    environment:
      ENVIRONMENT: Development
      RESERVATION_DB_SERVER: test-database,1433
      RESERVATION_DB_NAME: SportsReservationTestDB
      DB_USER: sa
      DB_PASSWORD: Test_Password123!
      JWT_KEY: test-only-signing-key-not-for-production-use
      JWT_ISSUER: SportsReservationAPI
      ADMIN_USERNAME: testadmin
      ADMIN_PASSWORD: TestAdminPassword123!
      API_BASE_URL: http://localhost:8080
      FRONTEND_BASE_URL: http://localhost:4200
      STRIPE_WEBHOOK_SECRET: whsec_test_dummy_value
    depends_on:
      test-database:
        condition: service_healthy

volumes:
  sql-data:
